<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery UI Widgets Demo</title>

    <!-- jQuery and jQuery UI CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .draggable-box {
            width: 150px;
            height: 150px;
            background-color: #4CAF50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            cursor: move;
        }

        .datepicker {
            margin-bottom: 20px;
        }

        .autocomplete {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h2>jQuery UI Widgets Demo</h2>

    <!-- Drag and Drop Box -->
    <div class="draggable-box">
        Drag Me
    </div>

    <!-- Date Picker Input -->
    <p>Select a date: <input type="text" id="datepicker" class="datepicker"></p>

    <!-- Autocomplete Input -->
    <p>Start typing a fruit: <input type="text" id="autocomplete" class="autocomplete"></p>

    <h3>Accordion Widget</h3>
    <div id="accordion">
    <h3>Section 1</h3>
    <div>
    <p>Content for section 1.</p>
    </div>
    <h3>Section 2</h3>
    <div>
    <p>Content for section 2.</p>
    </div>
    </div>

    <h3>Select a Date</h3>
    <input type="text" id="datepicker2" />

    <ul id="menu">
  <li class="ui-widget-header"><div>Category 1</div></li>
  <li><div>Option 1</div></li>
  <li><div>Option 2</div></li>
  <li><div>Option 3</div></li>
  <li class="ui-widget-header"><div>Category 2</div></li>
  <li><div>Option 4</div></li>
  <li><div>Option 5</div></li>
  <li><div>Option 6</div></li>
</ul>


    <script>
        $(document).ready(function () {
            // Draggable widget
            $(".draggable-box").draggable();

            // Datepicker widget
            $("#datepicker").datepicker();

            // Initialize Accordion
            $("#accordion").accordion();

            // Initialize Datepicker
            $("#datepicker2").datepicker();

            // Autocomplete widget
            var availableFruits = [
                "Apple", "Banana", "Cherry", "Date", "Grape", "Lemon", "Mango", "Orange",
                "Peach", "Pineapple", "Strawberry", "Watermelon"
            ];
            $("#autocomplete").autocomplete({
                source: availableFruits
            });

        $( function() {
            $( "#menu" ).menu({
        items: "> :not(.ui-widget-header)"
        });
  } );


        });
    </script>

    

</body>

</html>
